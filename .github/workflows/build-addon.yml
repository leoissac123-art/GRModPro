name: Build Bedrock add-on packages

on:
  push:
    paths:
      - "packs/**"
      - ".github/workflows/build-addon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate original resource pack textures
        run: |
          python3 packs/generate_realism_textures.py
          python3 packs/generate_classic_textures.py
          python3 packs/generate_realism_phase2.py

      - name: Build .mcpack and .mcaddon files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path(".")
          out = root / "downloads"
          out.mkdir(exist_ok=True)
          packs = [
              ("packs/grmodpro-horror-bp", out / "GRModPro-Horror-Behavior-1.0.0.mcpack"),
              ("packs/grmodpro-horror-rp", out / "GRModPro-Horror-Resources-1.0.0.mcpack"),
              ("packs/grmodpro-realism-rp", out / "GRModPro-Realism-Atmosphere-1.0.0.mcpack"),
              ("packs/grmodpro-realism-phase2-rp", out / "GRModPro-Realism-Phase-2-2.0.1.mcpack"),
              ("packs/grmodpro-classic-rp", out / "GRModPro-Classic-Blocks-1.0.0.mcpack"),
          ]
          for source, destination in packs:
              source = root / source
              with ZipFile(destination, "w", ZIP_DEFLATED) as archive:
                  for file in sorted(source.rglob("*")):
                      if file.is_file():
                          archive.write(file, file.relative_to(source).as_posix())

          horror_packs = packs[:2]
          addon = out / "GRModPro-Horror-1.0.0.mcaddon"
          with ZipFile(addon, "w", ZIP_DEFLATED) as archive:
              archive.write(horror_packs[0][1], horror_packs[0][1].name)
              archive.write(horror_packs[1][1], horror_packs[1][1].name)
          PY

      - name: Validate realism pack contents
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("downloads")
          required = [
              "textures/blocks/log_oak.png",
              "textures/blocks/log_spruce.png",
              "textures/blocks/log_birch.png",
              "textures/blocks/log_jungle.png",
              "textures/blocks/log_acacia.png",
              "textures/blocks/log_big_oak.png",
              "textures/blocks/planks_oak.png",
              "textures/blocks/leaves_oak.png",
              "textures/blocks/leaves_spruce.png",
              "textures/blocks/cherry_leaves.png",
              "manifest.json",
          ]
          ids = []
          for filename in [
              "GRModPro-Realism-Atmosphere-1.0.0.mcpack",
              "GRModPro-Realism-Phase-2-2.0.1.mcpack",
          ]:
              path = root / filename
              if not path.is_file():
                  raise SystemExit(f"Missing output package: {path}")
              with ZipFile(path) as archive:
                  names = set(archive.namelist())
                  missing = [name for name in required if name not in names]
                  if missing:
                      raise SystemExit(f"{filename} missing required files: {missing}")
                  manifest = json.loads(archive.read("manifest.json"))
                  ids.append((manifest["header"]["uuid"], manifest["modules"][0]["uuid"]))
                  for name in required:
                      if name.endswith(".png") and not archive.read(name).startswith(bytes([137, 80, 78, 71, 13, 10, 26, 10])):
                          raise SystemExit(f"Invalid PNG signature: {filename}:{name}")
                  print(f"Validated {filename}: {len(names)} files; required tree textures and manifest present")
          if ids[0][0] == ids[1][0] or ids[0][1] == ids[1][1]:
              raise SystemExit("Phase 1 and Phase 2 must use distinct header and module UUIDs")
          print("Both packs passed structural checks and have distinct identities.")
          PY

      - name: Commit rebuilt packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/*.mcpack downloads/*.mcaddon
          if git diff --cached --quiet; then
            echo "Packages already up to date."
          else
            git commit -m "Rebuild Bedrock add-on packages"
            git push
          fi
